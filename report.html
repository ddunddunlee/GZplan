<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<link rel="manifest" href="./manifest.json"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="GZ기획팀"/>
<meta name="theme-color" content="#ffffff"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>GZ Plan — 주간 보고</title>
<style>
:root{
  --bg:#fff;--bg2:#f7f7f5;--bg3:#f0f4f8;
  --text:#1a1a1a;--text2:#6b6b6b;--text3:#a8a8a8;
  --border:#e5e5e3;--border2:#d0d0cc;
  --radius:10px;--radius-sm:6px;
  --blue:#2563EB;--blue-bg:#EFF4FF;--blue-dk:#1D4ED8;
  --green:#10B981;--green-bg:#ECFDF5;--green-dk:#065F46;
  --amber:#F59E0B;--amber-bg:#FFFBEB;--amber-dk:#92400E;
  --red:#EF4444;--red-bg:#FEF2F2;--red-dk:#991B1B;
  --sw:220px;--sw-col:56px;--sb-ease:.22s cubic-bezier(.4,0,.2,1);
}
.main-wrap{
  margin-left:var(--sw);
  transition:margin-left var(--sb-ease);
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
}
.sidebar.collapsed ~ .main-wrap{margin-left:var(--sw-col)}
/* ── 사이드바 ── */
.sidebar{
  position:fixed;top:0;left:0;height:100vh;
  width:var(--sw);
  background:#0C447C;color:#fff;
  display:flex;flex-direction:column;
  transition:width var(--sb-ease);
  overflow:hidden;z-index:300;flex-shrink:0;
}
.sidebar.collapsed{width:var(--sw-col)}

.sb-toggle-btn{
  position:absolute;top:12px;right:10px;
  width:22px;height:22px;border-radius:6px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:10;flex-shrink:0;transition:all .15s;
}
.sb-toggle-btn:hover{background:rgba(255,255,255,.2)}
.sb-toggle-btn svg{transition:transform var(--sb-ease)}
.sidebar.collapsed .sb-toggle-btn svg{transform:rotate(180deg)}

.sb-brand{
  display:flex;align-items:center;gap:10px;
  padding:14px 14px 16px;border-bottom:1px solid rgba(255,255,255,.1);
  flex-shrink:0;white-space:nowrap;overflow:hidden;
}
.sb-mark{
  width:28px;height:28px;border-radius:8px;
  background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;flex-shrink:0;
}
.sb-brand-name{font-size:14px;font-weight:700;letter-spacing:-.2px;transition:opacity var(--sb-ease)}
.sidebar.collapsed .sb-brand-name{opacity:0;width:0;overflow:hidden}

.sb-user{
  display:flex;align-items:center;gap:9px;
  padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.1);
  flex-shrink:0;white-space:nowrap;overflow:hidden;
}
.sb-avatar{
  width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;flex-shrink:0;
}
.sb-user-info{transition:opacity var(--sb-ease)}
.sidebar.collapsed .sb-user-info{opacity:0;width:0;overflow:hidden}
.sb-user-name{font-size:13px;font-weight:600}
.sb-user-role{font-size:11px;opacity:.6}

.sb-nav{flex:1;padding:10px 8px;overflow-y:auto;overflow-x:hidden}
.sb-nav::-webkit-scrollbar{display:none}
.sb-sec{
  font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
  opacity:.45;padding:0 8px;margin:14px 0 4px;
  white-space:nowrap;transition:opacity var(--sb-ease);
}
.sidebar.collapsed .sb-sec{opacity:0}
.sb-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:var(--radius-sm);
  color:rgba(255,255,255,.7);font-size:13px;
  cursor:pointer;margin-bottom:1px;
  white-space:nowrap;overflow:hidden;
  transition:background .12s,color .12s;
  position:relative;text-decoration:none;
}
.sb-item:hover{background:rgba(255,255,255,.12);color:#fff}
.sb-item.active{background:rgba(255,255,255,.2);color:#fff;font-weight:600}
.sb-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-label{transition:opacity var(--sb-ease);overflow:hidden}
.sidebar.collapsed .sb-label{opacity:0;width:0}
.sb-badge{
  margin-left:auto;background:var(--red);color:#fff;
  font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;
  flex-shrink:0;transition:opacity var(--sb-ease);
}
.sidebar.collapsed .sb-badge{opacity:0;width:0;overflow:hidden;padding:0}

/* 툴팁 (collapsed) */
.sidebar.collapsed .sb-item:hover::after{
  content:attr(data-label);
  position:fixed;left:calc(var(--sw-col) + 8px);
  background:#1a1a1a;color:#fff;
  font-size:12px;padding:5px 10px;border-radius:6px;
  white-space:nowrap;pointer-events:none;z-index:999;
}

.sb-bottom{
  padding:10px 8px;
  border-top:1px solid rgba(255,255,255,.1);
  flex-shrink:0;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Segoe UI',sans-serif;
  background:var(--bg2);color:var(--text);min-height:100vh;font-size:14px}
.app{display:flex;min-height:100vh}


  .sb-logout:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.8)}
  .sidebar.collapsed .sb-logout{justify-content:center;padding:7px 0}
  .sb-logout-lbl{transition:opacity var(--sb-ease),max-width var(--sb-ease);max-width:200px;overflow:hidden}
  .sidebar.collapsed .sb-logout-lbl{opacity:0;max-width:0}
</style>
</head>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {
  getFirestore, collection, doc, getDoc, setDoc, getDocs, addDoc, updateDoc, orderBy, query, where
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyA7KylsSyT3_0oQvhBtcrPc-gcdfVq90IQ",
  authDomain:        "gzplan.firebaseapp.com",
  projectId:         "gzplan",
  storageBucket:     "gzplan.firebasestorage.app",
  messagingSenderId: "186255862586",
  appId:             "1:186255862586:web:f36d21f76012ca43b8fe03",
};

const MEMBER_IDS = ["강신욱","김용욱","오문식","이길우","이도영","이상현","이영찬","이윤형"];

// 담당 조직 (Firestore에서 덮어씀)
let MEMBER_ORGS = {
  "강신욱": ["IR/이사회 등","시장/경쟁사","보도자료 일정","사업지원본부(인프라지원실)","사업지원본부(경영지원실)","CISO","GLA"],
  "김용욱": ["중국","신규사업본부(시티골프사업부)","글로벌사업팀","글로벌사업개척TF"],
  "오문식": ["신규사업본부(카트사업부)","신규사업본부(시티골프사업부)","기술개발본부(NX개발실)","NX개발실(베트남R&D)"],
  "이길우": ["GS사업본부","AI센서개발실"],
  "이도영": ["미국","베트남"],
  "이상현": ["신규사업본부(플랫폼사업부)","기술개발본부(모바일개발실)","기술개발본부(GDR개발실)"],
  "이영찬": ["GDR직영사업","골프존 클라우드"],
  "이윤형": ["일본","사업지원본부(기획실)"]
};


const db = getFirestore(initializeApp(FIREBASE_CONFIG));
const sess = localStorage.getItem('tt_user');
if (!sess) { location.href = 'index.html'; throw ''; }
let ME;
try { ME = JSON.parse(sess); } catch { localStorage.removeItem('tt_user'); location.href = 'index.html'; throw ''; }
if (!ME?.id || !ME?.role) { localStorage.removeItem('tt_user'); location.href = 'index.html'; throw ''; }

const isMgr = ME.role === 'manager' || ME.role === 'admin';

// Firestore에서 설정 로드 (순서 + 담당 조직)
try {
  const [orgSnap, orderSnap] = await Promise.all([
    getDoc(doc(db, 'config', 'memberOrgs')),
    getDoc(doc(db, 'config', 'memberOrder'))
  ]);
  if (orgSnap.exists()) MEMBER_ORGS = orgSnap.data().orgs || MEMBER_ORGS;
  if (orderSnap.exists() && orderSnap.data().order?.length) {
    const savedOrder = orderSnap.data().order;
    // MEMBER_IDS 순서 업데이트
    MEMBER_IDS.length = 0;
    savedOrder.forEach(id => MEMBER_IDS.push(id));
  }
} catch(e) {}

// ── 사이드바 초기화 ──
document.getElementById('sbAvatar').textContent = (ME.displayName || ME.id || '--').slice(0,1);
document.getElementById('sbUserName').textContent = ME.displayName || ME.id || '';
document.getElementById('sbUserRole').textContent = isMgr ? '팀장' : '팀원';

const taskItem = document.getElementById('sbTaskItem');
const taskLabel = document.getElementById('sbTaskLabel');
if (taskItem) taskItem.dataset.nav = isMgr ? 'manager.html' : 'member.html';
if (taskLabel) taskLabel.textContent = isMgr ? '팀 업무 현황' : '내 업무';

// ── 주차 계산 ──
function getWeekKey(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  const day = d.getDay();
  const mon = new Date(d);
  mon.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  const sun = new Date(mon);
  sun.setDate(mon.getDate() + 6);
  const fmt = d => `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  return {
    key: `${mon.getFullYear()}W${String(getISOWeek(mon)).padStart(2,'0')}`,
    label: `${fmt(mon)} ~ ${fmt(sun)}`,
    mon, sun
  };
}

function weekKeyToMon(weekKey) {
  try {
    const [year, week] = weekKey.split('W').map(Number);
    const jan4 = new Date(year, 0, 4);
    const startOfWeek1 = new Date(jan4);
    startOfWeek1.setDate(jan4.getDate() - ((jan4.getDay() + 6) % 7));
    const mon = new Date(startOfWeek1);
    mon.setDate(startOfWeek1.getDate() + (week - 1) * 7);
    return mon;
  } catch(e) { return null; }
}

function weekKeyToLabel(weekKey, curKey) {
  try {
    const mon = weekKeyToMon(weekKey);
    if (!mon) return weekKey;
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    const fmt = d => `${d.getMonth()+1}.${d.getDate()}`;
    const dateStr = `${mon.getFullYear()}.${fmt(mon)} ~ ${fmt(sun)}`;

    // 상대 주차 라벨
    if (curKey) {
      const curMon = weekKeyToMon(curKey);
      if (curMon) {
        const diffDays = Math.round((curMon - mon) / 86400000);
        const diffWeeks = Math.round(diffDays / 7);
        let relLabel = '';
        if (diffWeeks === 1) relLabel = ' (전주)';
        else if (diffWeeks === 2) relLabel = ' (전전주)';
        else if (diffWeeks === -1) relLabel = ' (차주)';
        else if (diffWeeks > 2) relLabel = ` (${diffWeeks}주 전)`;
        return dateStr + relLabel;
      }
    }
    return dateStr;
  } catch(e) { return weekKey; }
}

function getISOWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
}

let curDate = new Date();
let curMember = isMgr ? MEMBER_IDS[0] : ME.id;

function updateWeekLabel() {
  const { label } = getWeekKey(curDate);
  document.getElementById('weekLabel').textContent = label;
}

// ── 토스트 ──
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ── 이번 주 개별 일정 로드 ──
// ── Firestore ──
function reportDoc(memberId, weekKey) {
  return doc(db, 'weeklyReports', memberId, 'weeks', weekKey);
}

async function loadReport(memberId, weekKey) {
  try {
    const snap = await getDoc(reportDoc(memberId, weekKey));
    return snap.exists() ? snap.data() : null;
  } catch(e) { return null; }
}

async function saveReport(memberId, weekKey, content, sections, tasks, taskMemo) {
  await setDoc(reportDoc(memberId, weekKey), {
    content: content || '',
    sections: sections || {},
    tasks: tasks || [],
    taskMemo: taskMemo || '',
    memberId,
    weekKey,
    updatedAt: new Date().toISOString(),
    displayName: ME.displayName || ME.id
  });
}

async function registerTask(memberId, weekKey, taskName, taskMemo) {
  // taskPool에 담당자 없이 등록
  await addDoc(collection(db,'taskPool'), {
    title: taskName,
    desc: taskMemo || '',
    priority: 3,
    status: 'todo',
    createdAt: new Date().toISOString(),
    createdBy: ME.displayName,
    source: 'weeklyReport',
    sourceMember: memberId,
    sourceWeek: weekKey,
  });
  // 등록이력 저장
  const snap = await getDoc(reportDoc(memberId, weekKey));
  const existing = snap.exists() ? (snap.data().registeredTasks || []) : [];
  if (!existing.includes(taskName)) {
    existing.push(taskName);
    await updateDoc(reportDoc(memberId, weekKey), { registeredTasks: existing });
  }
}

async function loadHistory(memberId) {
  try {
    const q = query(collection(db, 'weeklyReports', memberId, 'weeks'), orderBy('weekKey', 'desc'));
    const snap = await getDocs(q);
    return snap.docs.map(d => d.data());
  } catch(e) { return []; }
}

// ── 팀원 화면 ──
async function renderMemberView() {
  const { key, label } = getWeekKey(curDate);
  const data = await loadReport(ME.id, key);
  const content = data?.content || '';
  const updatedAt = data?.updatedAt ? new Date(data.updatedAt).toLocaleString('ko-KR', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';

  const history = await loadHistory(ME.id);
  const pastHistory = history.filter(h => h.weekKey !== key);

  const myOrgs = MEMBER_ORGS[ME.id] || [];
  const sections = ['추진 업무', ...myOrgs];
  const savedSections = data?.sections || {};

  const COLORS = ['#1a1a1a','#A32D2D','#0C447C','#639922','#633806','#6B5FCC'];
  const COLOR_NAMES = ['기본','빨강','파랑','초록','주황','보라'];

  const savedTasks = data?.tasks || [{ name:'', memo:'' }];
  const savedTaskMemo = data?.taskMemo || '';

  // 추진업무 셀 HTML
  const taskRows = savedTasks.map((t, ti) => `
    <tr>
      <td style="text-align:center;font-size:11px;color:var(--text3)">${ti+1}</td>
      <td><input class="task-input" data-tidx="${ti}" data-field="name" value="${(t.name||'').replace(/"/g,'&quot;')}" placeholder="업무명 입력..."/></td>
      <td><textarea class="task-memo-input" data-tidx="${ti}" data-field="memo" placeholder="메모" rows="1" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'">${t.memo||''}</textarea></td>
    </tr>`).join('');

  const taskSectionHtml = `
    <div style="border-bottom:0.5px solid var(--border)">
      <div class="org-section-title">추진 업무</div>
      <table class="task-table" id="taskTable">
        <colgroup>

      }).join('')}
    </div>` : ''}
  `;

  // 행 추가 버튼
  // 컬럼 리사이저
  (function() {
    const resizer = document.getElementById('taskColResizer');
    const colMemo = document.getElementById('colMemo');
    const table = document.getElementById('taskTable');
    if (!resizer || !colMemo || !table) return;
    let startX, startW;
    resizer.addEventListener('mousedown', e => {
      e.preventDefault();
      startX = e.clientX;
      startW = colMemo.offsetWidth;
      resizer.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      const onMove = e => {
        const diff = startX - e.clientX;
        const newW = Math.max(80, Math.min(500, startW + diff));
        colMemo.style.width = newW + 'px';
      };
      const onUp = () => {
        resizer.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
    // 터치 지원
    resizer.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      startW = colMemo.offsetWidth;
      const onMove = e => {
        const diff = startX - e.touches[0].clientX;
        const newW = Math.max(80, Math.min(500, startW + diff));
        colMemo.style.width = newW + 'px';
      };
      const onUp = () => {
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onUp);
      };
      document.addEventListener('touchmove', onMove);
      document.addEventListener('touchend', onUp);
    });

  document.getElementById('saveBtn').onclick = async () => {

    document.querySelectorAll('.editor-content').forEach(el => {
      sectionData[el.dataset.sec] = el.innerHTML;
    });
    document.getElementById('saveBtn').disabled = true;
    document.getElementById('saveBtn').textContent = '저장 중...';
    try {
      await saveReport(ME.id, key, '', sectionData, tasks, taskMemo);
      const now = new Date().toLocaleString('ko-KR', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
      document.getElementById('saveStatus').textContent = `저장됨 · ${now}`;
      document.getElementById('saveBtn').textContent = '✓ 저장됨';
      setTimeout(() => {
        document.getElementById('saveBtn').disabled = false;
        document.getElementById('saveBtn').textContent = '💾 저장';
      }, 2000);
      toast('저장됐어요 ✓');
    } catch(e) {
      toast('저장 실패: ' + e.message);
      document.getElementById('saveBtn').disabled = false;
      document.getElementById('saveBtn').textContent = '💾 저장';
    }
  };

  // Ctrl+S 단축키
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 's') {
      e.preventDefault();
      document.getElementById('saveBtn')?.click();
    }
  });
}

// ── 팀장 주요업무 로드/저장 ──
function mgrNoteDoc(weekKey) {
  return doc(db, 'weeklyMgrNote', weekKey);
}
async function loadMgrNote(weekKey) {
  try {
    const snap = await getDoc(mgrNoteDoc(weekKey));
    return snap.exists() ? snap.data().content || '' : '';
  } catch(e) { return ''; }
}
async function saveMgrNote(weekKey, content) {
  await setDoc(mgrNoteDoc(weekKey), { content, updatedAt: new Date().toISOString() });
}

// ── 이번 주 일정 로드 ──
async function loadWeekSchedules(monDate, sunDate) {
  const monStr = monDate.toISOString().slice(0,10);
  const sunStr = sunDate.toISOString().slice(0,10);
  try {
    const snap = await getDocs(query(collection(db,'schedules'), orderBy('startDate','asc')));
    const all = snap.docs.map(d => ({id:d.id,...d.data()}));
    return all.filter(ev => ev.startDate <= sunStr && (ev.endDate || ev.startDate) >= monStr);
  } catch(e) { return []; }
}

function fmtDate(str) {
  if (!str) return '';
  const d = new Date(str + 'T00:00:00');
  return `${d.getMonth()+1}/${d.getDate()}`;
}

// ── 리치텍스트 에디터 함수 ──
// 툴바 클릭 시 selection 유지 (mousedown preventDefault)
document.addEventListener('mousedown', e => {
  if (e.target.closest('.editor-toolbar') && e.target.tagName !== 'SELECT') {
    e.preventDefault();
  }
});

window.execCmd = (cmd, idx) => {
  const el = document.getElementById('editor_' + idx);
  if (el) el.focus();
  document.execCommand(cmd, false, null);
};
window.applyBgColor = (color, idx) => {
  const el = document.getElementById('editor_' + idx);
  if (el) el.focus();
  // backColor: Chrome/Edge, hiliteColor: Firefox
  const cmd = document.queryCommandSupported('backColor') ? 'backColor' : 'hiliteColor';
  document.execCommand(cmd, false, color);
};
window.applyFontSize = (size, idx) => {
  if (!size) return;
  const el = document.getElementById('editor_' + idx);
  if (el) el.focus();
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) return;
  const range = sel.getRangeAt(0);
  if (range.collapsed) return;
  const span = document.createElement('span');
  span.style.fontSize = size + 'px';
  try { range.surroundContents(span); } catch(e) {
    span.appendChild(range.extractContents());
    range.insertNode(span);
  }
};
window.applyColor = (color, idx) => {
  const el = document.getElementById('editor_' + idx);
  if (el) el.focus();
  document.execCommand('foreColor', false, color);
};

// 팀장 주요업무 에디터 함수
window.mgrCmd = (cmd) => { document.execCommand(cmd, false, null); };
window.mgrColor = (color) => { document.execCommand('foreColor', false, color); };
window.mgrBg = (color) => {
  const cmd = document.queryCommandSupported('backColor') ? 'backColor' : 'hiliteColor';
  document.execCommand(cmd, false, color);
};
window.mgrSize = (size) => { if(size) document.execCommand('fontSize', false, size); };

window.registerTaskClick = async (memberId, weekKey, taskName, taskMemo, btn) => {
  btn.disabled = true;
  btn.textContent = '등록 중...';
  try {
    await registerTask(memberId, weekKey, taskName, taskMemo);
    btn.textContent = '등록됨';
    btn.className = 'reg-btn done';
    toast(`업무관리에 등록됐어요 ✓`);
  } catch(e) {
    btn.disabled = false;
    btn.textContent = '업무등록 →';
    toast('오류: ' + e.message);
  }
};

window.toggleMgrNote = () => {
  const view = document.getElementById('mgrNoteView');
  const edit = document.getElementById('mgrNoteEdit');
  const input = document.getElementById('mgrNoteInput');
  view.style.display = 'none';
  edit.style.display = '';
  // 현재 내용 에디터에 로드
  input.innerHTML = view.innerHTML.includes('주요업무 및 일정을 입력해주세요') ? '' : view.innerHTML;
  input.focus();
  // 높이 자동 조절
  input.style.minHeight = Math.max(80, view.scrollHeight) + 'px';
};
window.cancelMgrNote = () => {
  document.getElementById('mgrNoteView').style.display = '';
  document.getElementById('mgrNoteEdit').style.display = 'none';
};
window.saveMgrNoteClick = async (weekKey) => {
  const input = document.getElementById('mgrNoteInput');
  const content = input.innerHTML;
  await saveMgrNote(weekKey, content);
  const view = document.getElementById('mgrNoteView');
  view.innerHTML = content && content !== '<br>' ? content : '<span style="color:var(--text3);font-size:12px">주요업무 및 일정을 입력해주세요</span>';
  view.style.display = '';
  document.getElementById('mgrNoteEdit').style.display = 'none';
  toast('저장됐어요 ✓');
};

window.selectMember = (id) => {
  curMember = id;
  renderManagerView();
};

// ── 주차 네비 ──
document.getElementById('prevBtn').onclick = () => {
  curDate.setDate(curDate.getDate() - 7);
  updateWeekLabel();
  isMgr ? renderManagerView() : renderMemberView();
};
document.getElementById('nextBtn').onclick = () => {
  curDate.setDate(curDate.getDate() + 7);
  updateWeekLabel();
  isMgr ? renderManagerView() : renderMemberView();
};
document.getElementById('todayBtn').onclick = () => {
  curDate = new Date();
  updateWeekLabel();
  isMgr ? renderManagerView() : renderMemberView();
};

// ── 사이드바 햄버거 ──


// ── 초기 렌더 ──
updateWeekLabel();
if (isMgr) {
  renderManagerView();
} else {
  renderMemberView();
}
